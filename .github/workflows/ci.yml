name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ["25", "27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The suite runs in Java and again with the fills in libtandem, built from the pinned tandem-c.
      - run: bash tools/build_native.sh
      - run: mvn -B verify -Pnative
  vectors:
    name: vector data and ziggurat tables are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
          python3 tools/gen_vectors.py ../tandem-spec/vectors.json > src/test/java/io/github/tandemrng/Vectors.java
          python3 tools/gen_zig_tables.py ../tandem-spec/tables/normal_f64_zig1024.json > src/main/java/io/github/tandemrng/ZigTables.java
          git diff --exit-code src/test/java/io/github/tandemrng/Vectors.java src/main/java/io/github/tandemrng/ZigTables.java
  # Against a pinned spec commit, so new upstream commits do not turn CI red.
  conformance:
    name: conformance files equal tandem-spec f420545
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone -q https://github.com/tandem-rng/spec ../tandem-spec
          git -C ../tandem-spec checkout -q f4205457e1e2ed19e655e36820015d7bdcf037dd
          diff -r --exclude='*.md' ../tandem-spec/conformance src/test/resources/conformance
  # GitHub runners have no GPU: this compiles the cuda module and runs its tests outside the
  # gpu tag, which check the error without a driver. GPU hosts run `pixi run gpu-test` in cuda/.
  cuda:
    name: cuda module without a GPU / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B -q install -DskipTests
      - run: mvn -B -f cuda/pom.xml verify
  ptx:
    name: PTX and fixtures match the pinned tandem-cuda and tandem-c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: cuda/pixi.toml
          environments: nvcc
          locked: true
      - run: pixi run --manifest-path cuda/pixi.toml -e nvcc ptx
      - run: git diff --exit-code cuda/src
