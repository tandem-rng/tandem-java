name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ["25", "27"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
  vectors:
    name: vector data is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
          python3 tools/gen_vectors.py ../tandem-spec/vectors.json > src/test/java/io/github/tandemrng/Vectors.java
          git diff --exit-code src/test/java/io/github/tandemrng/Vectors.java
  derived:
    name: derived data is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/tandem-rng/tandem-cuda ../tandem-cuda
          c++ -std=c++17 -I ../tandem-cuda/include tools/gen_derived.cpp -o gen_derived
          ./gen_derived > src/test/java/io/github/tandemrng/Derived.java
          git diff --exit-code src/test/java/io/github/tandemrng/Derived.java
  # GitHub runners have no GPU: this compiles the cuda module and runs its tests outside the
  # gpu tag, which check the error without a driver. GPU hosts run `pixi run gpu-test` in cuda/.
  cuda:
    name: cuda module without a GPU / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B -q install -DskipTests
      - run: mvn -B -f cuda/pom.xml verify
  ptx:
    name: PTX and fixtures match the pinned tandem-cuda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: cuda/pixi.toml
          environments: nvcc
          locked: true
      - run: pixi run --manifest-path cuda/pixi.toml -e nvcc ptx
      - run: git diff --exit-code cuda/src
